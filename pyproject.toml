[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-board-with-voice-assistance"
version = "0.1.0"
description = "Ask questions about your own documents - RAG chatbot with hybrid search and reranking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
